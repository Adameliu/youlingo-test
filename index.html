<style>
:root {
  --primary: #1cb0f6;
  --primary-border: #1899d6;
  --primary-light: #ddf4ff;
  --success: #58cc02;
  --success-border: #46a302;
  --success-light: #d7ffb8;
  --danger: #ff4b4b;
  --danger-border: #ea2b2b;
  --danger-light: #ffdfdf;
  --warning: #ffc800;
  --warning-border: #e5a400;
  --bg: #ffffff;
  --surface: #ffffff;
  --text-main: #3c3c3c;
  --text-muted: #afafaf;
  --border: #e5e5e5;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); font-family: 'Nunito', system-ui, -apple-system, sans-serif; color: var(--text-main); margin: 0; overflow-x: hidden; }
.container { max-width: 800px; margin: 0 auto; padding: 20px 15px; }
.navbar { background: #fff; border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 1000; padding: 12px 0; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }

/* 3D Button System */
.btn { font-weight: 800; border-radius: 16px; border: 2px solid transparent; letter-spacing: 0.8px; transition: all 0.1s ease; outline: none !important; text-transform: uppercase; font-size: 0.85rem; padding: 12px 20px; position: relative; }
.btn-primary { background: var(--primary); border-color: var(--primary-border); box-shadow: 0 4px 0 var(--primary-border); color: #fff; }
.btn-primary:hover { background: #14a0e0; border-color: #1289c0; }
.btn-primary:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }

.btn-success { background: var(--success); border-color: var(--success-border); box-shadow: 0 4px 0 var(--success-border); color: #fff; }
.btn-success:hover { background: #4caf02; border-color: #3e8e02; }
.btn-success:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }

.btn-danger { background: var(--danger); border-color: var(--danger-border); box-shadow: 0 4px 0 var(--danger-border); color: #fff; }
.btn-danger:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }

.btn-warning { background: var(--warning); border-color: var(--warning-border); box-shadow: 0 4px 0 var(--warning-border); color: #fff; }
.btn-warning:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }

.btn-info { background: #1cb0f6; border-color: #1899d6; box-shadow: 0 4px 0 #1899d6; color: #fff; }
.btn-info:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }

.btn-secondary { background: #afafaf; border-color: #8e8e8e; box-shadow: 0 4px 0 #8e8e8e; color: #fff; }
.btn-secondary:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }

.btn-outline-secondary { border: 2px solid var(--border); background: #fff; color: var(--text-muted); box-shadow: 0 4px 0 var(--border); }
.btn-outline-secondary:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }

.mod-card { background: var(--surface); border-radius: 20px; padding: 24px 16px; text-align: center; cursor: pointer; border: 2px solid var(--border); box-shadow: 0 4px 0 var(--border); transition: all .15s ease; position: relative; }
.mod-card:hover { border-color: var(--primary); background: var(--primary-light); }
.mod-card:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
.mod-card .name { font-weight: 800; font-size: 1.1rem; margin-bottom: 8px; }

.sec-item { background: var(--surface); border-radius: 20px; padding: 16px 24px; margin-bottom: 16px; cursor: pointer; border: 2px solid var(--border); box-shadow: 0 4px 0 var(--border); transition: all .15s ease; display: flex; justify-content: space-between; align-items: center; }
.sec-item:hover { border-color: var(--primary); background: var(--primary-light); }
.sec-item:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }

/* Study Interface */
#scr-study { margin-top: 0; }
.card-box { background: var(--surface); border-radius: 18px; padding: 12px; margin-top: 5px; border: 2px solid var(--border); box-shadow: 0 3px 0 var(--border); transition: all .2s; }
.card-box.wrong { border-color: var(--danger); box-shadow: 0 3px 0 var(--danger-border); animation: shake .4s ease; }
.card-box.correct { border-color: var(--success); box-shadow: 0 3px 0 var(--success-border); }
.q-text { font-size: 1.25rem; font-weight: 800; line-height: 1.2; margin-bottom: 10px; color: #4b4b4b; }
.pinfo { display: flex; justify-content: space-between; font-size: .7rem; font-weight: 800; color: var(--text-muted); margin-bottom: 4px; }

#opts-area { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.opt-btn { font-size: 0.9rem; font-weight: 700; padding: 6px 14px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); cursor: pointer; transition: all .1s ease; text-align: left; box-shadow: 0 3px 0 var(--border); color: var(--text-main); }
.opt-btn:hover { background: #f7f7f7; }
.opt-btn.sel { border-color: var(--primary); background: var(--primary-light); color: var(--primary); box-shadow: 0 3px 0 var(--primary); }

.inp { font-size: 1rem; font-weight: 700; text-align: center; padding: 8px 12px; border-radius: 12px; border: 2px solid var(--border); background: #f7f7f7; transition: all .2s ease; width: 100%; }
.inp:focus { border-color: var(--primary); background: #fff; outline: none; }
.inp.ok { border-color: var(--success) !important; background: var(--success-light) !important; color: var(--success-border); }
.inp.no { border-color: var(--danger) !important; background: var(--danger-light) !important; color: var(--danger-border); }

.fb { padding: 8px; border-radius: 12px; margin-top: 8px; font-size: 0.85rem; font-weight: 800; }
.fb.ok { background: var(--success-light); color: var(--success-border); }
.fb.no { background: var(--danger-light); color: var(--danger-border); }
.fb.fb-info { background: var(--primary-light); color: var(--primary); }

.acts { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
.acts .btn { flex: 1; min-width: 90px; padding: 6px 10px; font-size: 0.75rem; letter-spacing: 0.5px; }
.shortcut-hint { margin-top: 10px; color: var(--text-muted); font-size: 0.65rem; font-weight: 700; text-align: center; }
.shortcut-hint kbd { background: #f0f0f0; color: #777; border: 1px solid #ddd; border-bottom: 2px solid #ccc; border-radius: 4px; padding: 1px 5px; font-family: inherit; font-size: 0.7rem; margin: 0 2px; }

.pbar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
.pbar .fill { height: 100%; background: var(--success); border-radius: 4px; transition: width .4s ease; }

.hooray { text-align: center; padding: 40px 20px; }
.hooray i { font-size: 4rem; color: var(--success); margin-bottom: 20px; display: inline-block; }
.hooray h5 { font-weight: 900; font-size: 1.8rem; color: var(--text-main); }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
  20%, 40%, 60%, 80% { transform: translateX(5px); }
}
.shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
.inp::placeholder { color: #ccc; font-weight: 400; }
.hide { display: none !important; }
.mod-card .bar { height: 6px; background: var(--border); border-radius: 3px; margin-top: 10px; overflow: hidden; }
.mod-card .bar .fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width .5s ease; }
.stats { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
.stat { background: var(--surface); border-radius: 16px; padding: 14px 10px; flex: 1; min-width: 80px; text-align: center; border: 2px solid var(--border); box-shadow: 0 4px 0 var(--border); transition: all .15s; }
.stat:hover { transform: translateY(-2px); border-color: var(--primary); box-shadow: 0 4px 0 var(--primary-border); }
.stat .n { font-size: 1.6rem; font-weight: 800; color: var(--primary); }

.loading-bar { height: 4px; background: var(--border); overflow: hidden; position: relative; border-radius: 2px; }
.loading-bar::after { content: ""; position: absolute; left: -50%; width: 50%; height: 100%; background: var(--primary); animation: loading 1.5s infinite linear; }
@keyframes loading { from { left: -50%; } to { left: 100%; } }
</style>

// Global error handler
window.onerror = function(msg, url, line) {
    var el = document.getElementById('toast');
    if(!el) { el = document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
    el.textContent = '⚠ ' + (msg||'未知错误');
    el.classList.add('show');
    setTimeout(function(){ el.classList.remove('show'); }, 4000);
};
function showFatal(msg) {
    var el = document.getElementById('login-page') || document.getElementById('app') || document.body;
    var safeMsg = esc(msg || '未知错误');
    el.innerHTML = '<div class="alert alert-danger m-3" style="max-width:500px;margin:40px auto"><h5>✗ 加载失败</h5><p class="small">'+safeMsg+'</p><button class="btn btn-sm btn-outline-secondary" onclick="location.reload()">刷新页面</button></div>';
}

const STORAGE_KEY = "youlingo_progress_v2";

// XSS-safe HTML escaping for plain text inserted via innerHTML
function esc(s) {
    if(!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// Rich text sanitizer: strip dangerous HTML, keep safe formatting tags
// Used for question text, options, and answers that legitimately contain <span style="color:red"> etc.
function sanitizeHTML(html) {
    if(!html) return '';
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    sanitizeNode(tmp);
    return tmp.innerHTML;
}
function sanitizeNode(node) {
    var ALLOWED_TAGS = {'SPAN':1,'B':1,'I':1,'U':1,'EM':1,'STRONG':1,'BR':1,'SUB':1,'SUP':1};
    var ALLOWED_STYLE = /color|font-weight|font-style|text-decoration|background-color/;
    var children = Array.prototype.slice.call(node.childNodes);
    for(var i=0; i<children.length; i++) {
        var child = children[i];
        if(child.nodeType === 3) continue; // text node, safe
        if(child.nodeType !== 1) { node.removeChild(child); continue; } // remove non-element nodes
        // Remove disallowed tags but keep their children
        if(!ALLOWED_TAGS[child.tagName]) {
            while(child.firstChild) node.insertBefore(child.firstChild, child);
            node.removeChild(child);
            continue;
        }
        // Strip all attributes except safe style
        var attrs = Array.prototype.slice.call(child.attributes);
        for(var a=0; a<attrs.length; a++) {
            var attr = attrs[a];
            if(attr.name === 'style') {
                // Filter style to only allow safe properties
                var safeStyles = [];
                var parts = attr.value.split(';');
                for(var s=0; s<parts.length; s++) {
                    var prop = parts[s].split(':')[0].trim().toLowerCase();
                    if(ALLOWED_STYLE.test(prop)) safeStyles.push(parts[s]);
                }
                if(safeStyles.length) child.setAttribute('style', safeStyles.join(';'));
                else child.removeAttribute('style');
            } else if(attr.name !== 'class') {
                child.removeAttribute(attr.name);
            }
        }
        // Recursively sanitize children
        sanitizeNode(child);
    }
}

var curModIdx = -1, curSecIdx = -1;
var STATE_KEY = "youlingo_state";

function saveState() {
    var state = {mi:curModIdx, si:curSecIdx, ci:cardIdx};
    var scr = document.getElementById("scr-study");
    state.study = scr && !scr.classList.contains("hide");
    try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch(e){}
}
function clearState() { try { localStorage.removeItem(STATE_KEY); } catch(e){} }
function restoreState() {
    try {
        var s = JSON.parse(localStorage.getItem(STATE_KEY));
        if(!s || !s.study || !langData || !langData[s.mi]) {
            clearState(); return;
        }
        var sec = langData[s.mi].sections[s.si];
        if(!sec) { clearState(); return; }
        // Re-enter study mode at saved position
        startStudy(s.mi, s.si);
        if(s.ci > 0 && s.ci < cards.length) {
            cardIdx = s.ci;
            showCard();
        }
    } catch(e){ clearState(); }
}

// Helper to get consistent date key (YYYY-MM-DD)
function getTodayDateStr() {
    var d = new Date();
    var month = '' + (d.getMonth() + 1), day = '' + d.getDate(), year = d.getFullYear();
    if (month.length < 2) month = '0' + month;
    if (day.length < 2) day = '0' + day;
    return [year, month, day].join('-');
}

// Helper to sync remote stats and merge ID sets safely
function handleRemoteStats(fd) {
    if(!fd) return;
    var today = getTodayDateStr();
    var cur = JSON.parse(localStorage.getItem("y_stats")||"{}");
    if(cur.d !== today) { cur = {d:today, n:0, ids:[]}; }

    if(fd.d === today) {
        if (!fd.ids && fd.n > 0) {
            // Legacy/migrated data without IDs
            if (cur.n < fd.n) {
                cur.n = fd.n;
                cur.ids = cur.ids || [];
                localStorage.setItem("y_stats", JSON.stringify(cur));
            }
        } else {
            var mergedIds = cur.ids || [];
            var remoteIds = fd.ids || [];
            var changedLocal = false;
            
            for(var i=0; i<remoteIds.length; i++) {
                if(mergedIds.indexOf(remoteIds[i]) === -1) {
                    mergedIds.push(remoteIds[i]);
                    changedLocal = true;
                }
            }
            
            var needsPush = mergedIds.length > remoteIds.length;

            if(changedLocal || cur.n !== mergedIds.length) {
                cur.ids = mergedIds;
                cur.n = Math.max(cur.n || 0, mergedIds.length);
                localStorage.setItem("y_stats", JSON.stringify(cur));
            }
            
            if(needsPush) {
                _supa.from("daily_stats").upsert({uid:_uid, data:cur}, {onConflict:"uid"}).select().catch(function(){});
            }
        }
        
        // ALWAYS refresh UI on incoming current-day data to handle same-browser multi-tab sync
        refreshStatsDisplay();
        
    } else if (fd.d !== today) {
         if(cur.n > 0) {
             _supa.from("daily_stats").upsert({uid:_uid, data:cur}, {onConflict:"uid"}).select().catch(function(){});
         }
    }
}

function loadDailyStats() {
    var tk = getTodayDateStr();

function norm(s) { return s.replace(/\s+/g," ").trim(); }

function stripPunct(s) {
    return s.replace(/[.,!?。，、！？.]+$/g, "");
}

function normApost(s) { return s.replace(/[‘’‚‛′‵`']/g, "'"); }

function checkAns(ua, ca) {
    if(!ua || !ca) return false;
    var u = normApost(norm(ua));
    var up = stripPunct(u);
    var alts = ca.split("或").map(function(s){ return normApost(norm(s)); }).filter(Boolean);
    for(var i=0; i<alts.length; i++) {
        var a = norm(alts[i]);
        var ap = stripPunct(a);
        if(u === a || up === ap) return true;
    }
    if(ca.indexOf("或") === -1 && ca.indexOf(",") >= 0) {
        var ca2 = ca.split(",").map(function(s){ return normApost(norm(s)); }).filter(Boolean);
        for(var i=0; i<ca2.length; i++) {
            var a = normApost(norm(ca2[i]));
            var ap = stripPunct(a);
            if(u === a || up === ap) return true;
        }
    }
    return false;
}

function startStudy(mi, si) {
    if(!langData || !langData[mi] || !langData[mi].sections[si]) return;
    curModIdx = mi;
    curSecIdx = si;
    saveState();
    var sec = langData[mi].sections[si];
    document.getElementById("scr-modules").classList.add("hide");
    document.getElementById("scr-sections").classList.add("hide");
    var _st=document.getElementById("scr-study");_st.classList.remove("hide");_st.classList.remove("page-in");void _st.offsetWidth;_st.classList.add("page-in");
    document.getElementById("study-sec-name").textContent = sec.name.substring(0,45);
    var available = [];
    for(var ci=0; ci<sec.cards.length; ci++) {
        var c = sec.cards[ci];
        var p = prog[c.i];
        if(!p || !p.m) available.push(c);
    }
    if(available.length === 0) {
        available = sec.cards.slice();
        for(var ci=0; ci<sec.cards.length; ci++) {
            var p = prog[sec.cards[ci].i];
            if(p) { delete p.m; delete p.done; }
        }
        saveProg();
    }
    var typeOrder = ["dictation","dictationChinese","meaningChinese","word","multi","gender","plural","feminine","pastParticiple","isSeparable","presentTenseConjugation","pastTenseConjugation","konjunktivII","imperativ","comparativ","superlativ","phrase","custom","array","一般"];
    // 词组式出题：按类型分组 → 同类型内按 word._id 聚合 → 词组间随机
    var groups = {};
    for(var ci=0; ci<available.length; ci++) {
        var c = available[ci];
        var t = c.t || "一般";
        if(!groups[t]) groups[t] = [];
        groups[t].push(c);
    }
    cards = [];
    for(var ti=0; ti<typeOrder.length; ti++) {
        var t = typeOrder[ti];
        if(groups[t]) {
            var g = groups[t].slice();
            // 按 word._id 分组（同词卡片在一起）
            var byWord = {}, noWord = [];
            for(var i=0; i<g.length; i++) {
                var wid = (g[i].word && g[i].word._id) ? g[i].word._id.toString() : null;
                if(wid) { if(!byWord[wid]) byWord[wid]=[]; byWord[wid].push(g[i]); }
                else noWord.push(g[i]);
            }
            // 词组间随机打乱
            var wordKeys = Object.keys(byWord);
            for(var i=wordKeys.length-1; i>0; i--) {
                var j = Math.floor(Math.random()*(i+1));
                var tmp = wordKeys[i]; wordKeys[i] = wordKeys[j]; wordKeys[j] = tmp;
            }
            // 输出：同词卡片连续，词间随机
            for(var wi=0; wi<wordKeys.length; wi++) {
                var wg = byWord[wordKeys[wi]];
                for(var i=0; i<wg.length; i++) cards.push(wg[i]);
            }
            for(var i=0; i<noWord.length; i++) cards.push(noWord[i]);
        }
    }
    cardIdx = 0;
    sessStats = {ok:0,no:0,tot:0};
    showCard();
}

        if(p.r <= 3 && !_isFast) {

            var learnLevels = [0.25, 1, 24]; // 单位: 小时
            var idx = Math.min(p.r - 1, learnLevels.length - 1);

            var prevDays = prevI > 0 ? prevI / 24 : 1;
                        var newDays = Math.min(365, Math.max(1, Math.round(prevDays * ef)));
            p.i = newDays * 24; // 统一存储为小时

        }
        p.e = ef;

            var wrongIntervals = [1, 2, 5, 15]; // 分钟

var _studySkipTo = null;
function startStudyAll() {
    var now = Date.now();
    var curMi = -1, curSi = -1;
    var found = false;

    // Use a while loop to find the next section to study
    while (!found) {
        curMi = -1; curSi = -1;
        for(var mi=0; mi<langData.length; mi++) {
            for(var si=0; si<langData[mi].sections.length; si++) {
                if(_studySkipTo && (mi < _studySkipTo.mi || (mi === _studySkipTo.mi && si < _studySkipTo.si))) continue;
                if(_studySkipTo) _studySkipTo = null;
                var sec = langData[mi].sections[si];
                for(var ci=0; ci<sec.cards.length; ci++) {
                    var p = prog[sec.cards[ci].i];
                    if(!p || !p.m) { curMi = mi; curSi = si; break; }
                }
                if(curMi >= 0) break;
            }
            if(curMi >= 0) break;
        }

        if(curMi < 0) { alert("全部学习完成！"); return; }

        // Collect review cards from ALL earlier sections + current section
        var reviewCards = [];
        var newCards = [];
        var typeOrder = ["dictation","dictationChinese","meaningChinese","word","multi","gender","plural","feminine","pastParticiple","isSeparable","presentTenseConjugation","pastTenseConjugation","konjunktivII","imperativ","comparativ","superlativ","phrase","custom","array","一般"];
        
        for(var mi=0; mi<=curMi; mi++) {
            var maxSi = (mi === curMi) ? curSi : langData[mi].sections.length - 1;
            for(var si=0; si<=maxSi; si++) {
                var sec = langData[mi].sections[si];
                for(var ci=0; ci<sec.cards.length; ci++) {
                    var c = sec.cards[ci];
                    var p = prog[c.i];
                    if(p && p.m) continue;
                    if(p && p.n && p.n < now) {
                        reviewCards.push({card:c, modIdx:mi, secIdx:si});
                    } else if(!p || (!p.r && !p.m)) {
                        newCards.push({card:c, modIdx:mi, secIdx:si});
                    }
                }
            }
        }

        if(reviewCards.length === 0 && newCards.length === 0) {
            _studySkipTo = {mi: curMi, si: curSi + 1};
            if(_studySkipTo.si >= langData[_studySkipTo.mi].sections.length) {
                _studySkipTo.mi++; _studySkipTo.si = 0;
            }
            if(_studySkipTo.mi >= langData.length) {
                alert("全部学习完成！");
                _studySkipTo = null;
                return;
            }
            // Loop will continue to find next available section
        } else {
            found = true;
        }
    }
    _studySkipTo = null;
    
    function sortCards(arr) {
        var groups = {};
        for(var i=0; i<arr.length; i++) {
            var t = arr[i].card.t || "一般";
            if(!groups[t]) groups[t] = [];
            groups[t].push(arr[i]);
        }
        var result = [];
        for(var ti=0; ti<typeOrder.length; ti++) {
            var t = typeOrder[ti];
            if(groups[t]) {
                var g = groups[t].slice();
                // 按 word._id 分组（同词卡片连续）
                var byWord = {}, noWord = [];
                for(var i=0; i<g.length; i++) {
                    var wid = (g[i].card.word && g[i].card.word._id) ? g[i].card.word._id.toString() : null;
                    if(wid) { if(!byWord[wid]) byWord[wid]=[]; byWord[wid].push(g[i]); }
                    else noWord.push(g[i]);
                }
                var wordKeys = Object.keys(byWord);
                for(var i=wordKeys.length-1; i>0; i--) { var j=Math.floor(Math.random()*(i+1)); var tmp=wordKeys[i]; wordKeys[i]=wordKeys[j]; wordKeys[j]=tmp; }
                for(var wi=0; wi<wordKeys.length; wi++) {
                    var wg = byWord[wordKeys[wi]];
                    for(var i=0; i<wg.length; i++) result.push(wg[i]);
                }
                for(var i=0; i<noWord.length; i++) result.push(noWord[i]);
            }
        }
        return result;
    }
    
    var allCards = sortCards(reviewCards).concat(sortCards(newCards));
    
    curModIdx = curMi;
    curSecIdx = curSi;
    cards = allCards.map(function(x){ return x.card; });
    cardIdx = 0;
    sessStats = {ok:0, no:0, tot:0};
    
    document.getElementById("scr-modules").classList.add("hide");
    document.getElementById("scr-sections").classList.add("hide");
    document.getElementById("scr-study").classList.remove("hide");
    document.getElementById("study-sec-name").textContent = "智能学习 - " + langData[curMi].name;
    showCard();
}

    document.getElementById("btn-show").classList.add("hide");
    document.getElementById("btn-submit").classList.add("hide");
};
document.getElementById("btn-next").onclick = nextCard;
document.getElementById("btn-easy").onclick = markEasy;
document.getElementById("btn-42").onclick = mark42;
document.getElementById("back-mod2").onclick = function() {
    document.getElementById("scr-sections").classList.add("hide");
    var _sm2=document.getElementById("scr-modules");_sm2.classList.remove("hide");_sm2.classList.remove("page-in");void _sm2.offsetWidth;_sm2.classList.add("page-in");
    renderMods();
};
var _bs = document.getElementById("back-sec");
if(_bs) _bs.onclick = function() {
    document.getElementById("scr-study").classList.add("hide");
    document.getElementById("scr-sections").classList.remove("hide");
    showSecs(curModIdx);
};
document.getElementById("btn-done").onclick = function() {
    document.getElementById("scr-study").classList.add("hide");
    document.getElementById("scr-sections").classList.remove("hide");
    showSecs(curModIdx);
};

document.getElementById("btn-next-sec").onclick = function() {
    document.getElementById("scr-study").classList.add("hide");
    // Find next section with un-mastered cards
    for(var mi=curModIdx; mi<langData.length; mi++) {
        for(var si=(mi===curModIdx?curSecIdx+1:0); si<langData[mi].sections.length; si++) {
            var sec = langData[mi].sections[si];
            for(var ci=0; ci<sec.cards.length; ci++) {
                var p = prog[sec.cards[ci].i];
                if(!p || !p.m) {
                    startStudy(mi, si);
                    return;
                }
            }
        }
    }
    alert("全部学习完成！");
    goHome();
};
document.addEventListener("keydown", function(e) {
    // Enter: 提交或下一题
    if(e.key==="Enter") {
        if(!document.getElementById("btn-submit").classList.contains("hide")) {
            var _inp=document.getElementById("ans-inp");
            var _oa=document.getElementById("opts-area");
            var _isOpts=_oa && !_oa.classList.contains("hide");
            var _isEmpty=_inp && !_isOpts && (!_inp.value || !_inp.value.trim());
            if(_isEmpty && curCard && curCard.au) { play(curCard.au); }
            else { submitAns(); }
        }
        else if(!document.getElementById("btn-next").classList.contains("hide")) nextCard();
        else if(!document.getElementById("btn-next-sec").classList.contains("hide")) document.getElementById("btn-next-sec").click();
    }
    // 数字键 1-4 快速选择选项
    if(e.key >= "1" && e.key <= "4" && !document.getElementById("btn-submit").classList.contains("hide")) {
        var oa = document.getElementById("opts-area");
        if(oa && !oa.classList.contains("hide")) {
            var idx = parseInt(e.key) - 1;
            var opts = oa.querySelectorAll("div");
            if(opts[idx]) opts[idx].click();
        }
    }
    // E键：太简单了
    if((e.key==="e"||e.key==="E") && !document.getElementById("btn-easy").classList.contains("hide") && (!document.activeElement || (document.activeElement.tagName !== "INPUT" && !(document.activeElement.id && document.activeElement.id.indexOf("mf-")===0)))) {
        e.preventDefault();
        markEasy();
    }
    // D键：42天后再问我
    if((e.key==="d"||e.key==="D") && !document.getElementById("btn-42").classList.contains("hide") && (!document.activeElement || (document.activeElement.tagName !== "INPUT" && !(document.activeElement.id && document.activeElement.id.indexOf("mf-")===0)))) {
        e.preventDefault();
        mark42();
    }
    // 空格键：下一题
    if(e.key === " " && !document.getElementById("btn-next").classList.contains("hide") && (!document.activeElement || document.activeElement.tagName !== "INPUT")) {
        e.preventDefault();
        nextCard();
    }
});
