<style>
:root{--primary:#17a2b8;--bg:#f0f2f5}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;margin:0}
.container{max-width:720px;margin:0 auto;padding:15px}
.navbar{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,0.06);position:sticky;top:0;z-index:100}
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.loading-bar{height:3px;background:#e0e0e0;border-radius:2px;overflow:hidden;margin:5px 0}
.loading-bar::after{content:'';display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--primary),#20c997);border-radius:2px;animation:loadSlide 1.2s ease-in-out infinite}
@keyframes loadSlide{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.page-in{animation:fadeIn .25s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes popIn{0%{transform:scale(0.9);opacity:0}100%{transform:scale(1);opacity:1}}
.mod-card{background:#fff;border-radius:14px;padding:16px 12px;text-align:center;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,0.06);border:2px solid transparent;transition:all .2s ease}
.mod-card:hover{border-color:var(--primary);box-shadow:0 6px 24px rgba(0,0,0,0.10);transform:translateY(-2px)}
.mod-card:active{transform:scale(0.97)}
.mod-card.done{opacity:.6}
.mod-card.done .name::after{content:' ✓';color:#28a745;font-weight:700}
.mod-card .name{font-weight:600;font-size:.85rem}
.mod-card .count{font-size:.72rem;color:#999;margin-top:3px}
.mod-card .bar{height:4px;background:#e9ecef;border-radius:2px;margin-top:8px;overflow:hidden}
.mod-card .bar .fill{height:100%;background:linear-gradient(90deg,var(--primary),#20c997);border-radius:2px;transition:width .5s ease}
.sec-list{margin-top:12px}
.sec-item{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,0.04);transition:all .15s ease}
.sec-item:hover{transform:translateX(4px);box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.sec-item:active{transform:scale(0.98)}
.sec-item.done{opacity:.55}
.sec-item .sn{font-size:.9rem;font-weight:500}
.sec-item .sm{font-size:.72rem;color:#999;margin-top:2px}
.sec-item .sb{height:3px;background:#e9ecef;border-radius:2px;margin-top:4px;width:80px;overflow:hidden}
.sec-item .sb .fill{height:100%;background:linear-gradient(90deg,var(--primary),#20c997);transition:width .4s ease}
.sec-item .badge{font-size:.72rem;padding:3px 8px}
.card-box{background:#fff;border-radius:18px;box-shadow:0 2px 12px rgba(0,0,0,0.06);padding:25px;margin-top:15px;min-height:260px;transition:border-color .2s,box-shadow .2s}
.card-box.wrong{border:2px solid #dc3545;box-shadow:0 0 12px rgba(220,53,69,0.25);animation:shake .4s ease}
.card-box.correct{border:2px solid #28a745;box-shadow:0 0 6px rgba(40,167,69,0.08)}
.q-text{font-size:1.05rem;line-height:1.7;margin-bottom:15px}
.q-text .audio-btn{display:inline-block;width:32px;cursor:pointer;vertical-align:middle}
.opt-btn{font-size:.95rem;padding:12px 16px;border-radius:12px;border:2px solid #e2e8f0;background:#fff;cursor:pointer;transition:all .15s ease;text-align:left}
.opt-btn:hover{border-color:var(--primary);background:#e8f4fd;box-shadow:0 2px 8px rgba(23,162,184,0.12)}
.opt-btn:active{transform:scale(0.97)}
.opt-btn.sel{border-color:var(--primary);background:#d1ecf1;color:#0c5460;font-weight:600}
.inp{font-size:1.05rem;text-align:center;padding:14px;border-radius:10px;border:2px solid #e2e8f0;transition:all .2s ease}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 .2rem rgba(23,162,184,0.15)}
.inp.ok{border-color:#28a745 !important;background:#d4edda !important}
.inp.no{border-color:#dc3545 !important;background:#f8d7da !important;animation:shake .4s ease}
.fb{padding:14px;border-radius:12px;margin-top:12px;font-size:.9rem}
.fb.ok{background:#d4edda !important;color:#155724 !important;border:1px solid #a3cfbb !important}
.fb.no{background:#dc3545 !important;color:#fff !important;border:none !important}
.fb.fb-info{background:#e8f4fd !important;color:#0c5460 !important;border:1px solid #bee5eb !important}
.pbar{height:6px;background:#e9ecef;border-radius:3px;overflow:hidden;margin-bottom:10px}
.pbar .fill{height:100%;background:linear-gradient(90deg,var(--primary),#20c997);border-radius:3px;transition:width .4s ease}
.pinfo{display:flex;justify-content:space-between;font-size:.8rem;color:#999;margin-bottom:8px}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts .btn{font-size:.85rem;padding:8px 16px}
.hooray{text-align:center;padding:40px 20px}
.hooray i{font-size:3rem;color:#28a745}
.hooray h5{margin-top:12px;font-weight:700}
.stats{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}
.stat{background:#fff;border-radius:12px;padding:14px 10px;flex:1;min-width:80px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,0.06);transition:transform .2s}
.stat:hover{transform:translateY(-2px)}
.stat .n{font-size:1.5rem;font-weight:700;color:var(--primary)}
.stat .l{font-size:.7rem;color:#999;margin-top:2px}
.hide{display:none!important}
.tbadge{display:inline-block;background:#e8f4fd;color:#0c5460;padding:3px 10px;border-radius:10px;font-size:.72rem;font-weight:500}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#dc3545;color:#fff;padding:12px 24px;border-radius:10px;font-size:.85rem;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,0.15)}
.toast.show{opacity:1}
.shortcut-hint{text-align:center;margin-top:10px;padding:6px 12px;background:#f8f9fa;border-radius:8px;font-size:.72rem;color:#999;letter-spacing:.3px;line-height:1.6;user-select:none;transition:opacity .2s}
.shortcut-hint:empty{display:none}
.shortcut-hint kbd{display:inline-block;padding:1px 5px;font-size:.65rem;font-family:inherit;color:#555;background:#fff;border:1px solid #d0d0d0;border-radius:4px;box-shadow:0 1px 0 #bbb;margin:0 1px;vertical-align:middle;line-height:1.4}
#btn-misclick{color:#6c757d;background:#fff;border:1px solid #dee2e6;font-size:.85rem}
#btn-misclick:hover{background:#f0f0f0;color:#333;border-color:#ccc}
@media(max-width:600px){.grid-3{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.card-box{padding:18px 14px;border-radius:14px}.opt-btn{padding:14px;font-size:1rem;min-height:48px}.inp{padding:14px;font-size:1.1rem;min-height:48px}.btn{min-height:44px}.stat .n{font-size:1.3rem}}
</style>
</head>

<script>
// Global error handler
window.onerror = function(msg, url, line) {
    var el = document.getElementById('toast');
    if(!el) { el = document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
    el.textContent = '⚠ ' + (msg||'未知错误');
    el.classList.add('show');
    setTimeout(function(){ el.classList.remove('show'); }, 4000);
};
function showFatal(msg) {
    var el = document.getElementById('login-page') || document.getElementById('app') || document.body;
    var safeMsg = esc(msg || '未知错误');
    el.innerHTML = '<div class="alert alert-danger m-3" style="max-width:500px;margin:40px auto"><h5>✗ 加载失败</h5><p class="small">'+safeMsg+'</p><button class="btn btn-sm btn-outline-secondary" onclick="location.reload()">刷新页面</button></div>';
}

const STORAGE_KEY = "youlingo_progress_v2";

// XSS-safe HTML escaping for plain text inserted via innerHTML
function esc(s) {
    if(!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// Rich text sanitizer: strip dangerous HTML, keep safe formatting tags
// Used for question text, options, and answers that legitimately contain <span style="color:red"> etc.
function sanitizeHTML(html) {
    if(!html) return '';
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    sanitizeNode(tmp);
    return tmp.innerHTML;
}
function sanitizeNode(node) {
    var ALLOWED_TAGS = {'SPAN':1,'B':1,'I':1,'U':1,'EM':1,'STRONG':1,'BR':1,'SUB':1,'SUP':1};
    var ALLOWED_STYLE = /color|font-weight|font-style|text-decoration|background-color/;
    var children = Array.prototype.slice.call(node.childNodes);
    for(var i=0; i<children.length; i++) {
        var child = children[i];
        if(child.nodeType === 3) continue; // text node, safe
        if(child.nodeType !== 1) { node.removeChild(child); continue; } // remove non-element nodes
        // Remove disallowed tags but keep their children
        if(!ALLOWED_TAGS[child.tagName]) {
            while(child.firstChild) node.insertBefore(child.firstChild, child);
            node.removeChild(child);
            continue;
        }
        // Strip all attributes except safe style
        var attrs = Array.prototype.slice.call(child.attributes);
        for(var a=0; a<attrs.length; a++) {
            var attr = attrs[a];
            if(attr.name === 'style') {
                // Filter style to only allow safe properties
                var safeStyles = [];
                var parts = attr.value.split(';');
                for(var s=0; s<parts.length; s++) {
                    var prop = parts[s].split(':')[0].trim().toLowerCase();
                    if(ALLOWED_STYLE.test(prop)) safeStyles.push(parts[s]);
                }
                if(safeStyles.length) child.setAttribute('style', safeStyles.join(';'));
                else child.removeAttribute('style');
            } else if(attr.name !== 'class') {
                child.removeAttribute(attr.name);
            }
        }
        // Recursively sanitize children
        sanitizeNode(child);
    }
}

var curModIdx = -1, curSecIdx = -1;
var STATE_KEY = "youlingo_state";

function saveState() {
    var state = {mi:curModIdx, si:curSecIdx, ci:cardIdx};
    var scr = document.getElementById("scr-study");
    state.study = scr && !scr.classList.contains("hide");
    try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch(e){}
}
function clearState() { try { localStorage.removeItem(STATE_KEY); } catch(e){} }
function restoreState() {
    try {
        var s = JSON.parse(localStorage.getItem(STATE_KEY));
        if(!s || !s.study || !langData || !langData[s.mi]) {
            clearState(); return;
        }
        var sec = langData[s.mi].sections[s.si];
        if(!sec) { clearState(); return; }
        // Re-enter study mode at saved position
        startStudy(s.mi, s.si);
        if(s.ci > 0 && s.ci < cards.length) {
            cardIdx = s.ci;
            showCard();
        }
    } catch(e){ clearState(); }
}
var cards = [], cardIdx = 0, curCard = null;
var sessStats = {ok:0, no:0, tot:0};
var prog = {};
var _audio = null;
var _cardShownAt = 0; // 卡片显示时间戳，用于判断答题速度

// Supabase
var _supa = supabase.createClient('https://iwpzcmmwtnvcphatrucd.supabase.co', 'sb_publishable_1DKV3HyHb9yf5riwUGNwLQ_99TA-F45');
var _uid = null;
var R2_BASE = "https://pub-1c1a3bd3f4554dc4afce6c91070cf22e.r2.dev";

var _saveTimer = null;
var _syncing = false;
function saveProg() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(prog));
    if(isDemo || !_uid) return;
    if(_saveTimer) clearTimeout(_saveTimer);
    _saveTimer = setTimeout(function() {
        _syncing = true;
        _supa.from('progress').upsert({uid:_uid, data:prog}, {onConflict:'uid'}).then(function(){_syncing=false;}).catch(function(){_syncing=false;});
    }, 300);
}

function loadDailyStats() {
    if(!_uid) return;
    try {
        var sd = JSON.parse(localStorage.getItem("y_stats")||"{}");
        var td = new Date(), tk = td.getFullYear()+"-"+(td.getMonth()+1)+"-"+td.getDate();
        _supa.from("daily_stats").select("data").eq("uid",_uid).single().then(function(result) {
            console.log("loadDailyStats result:", result);
            var fd = result.data && result.data.data;
            if(fd && fd.d === tk && fd.n > (sd.n||0)) {
                localStorage.setItem("y_stats", JSON.stringify(fd));
                var el = document.getElementById("today-cnt");
                if(el) el.textContent = "今日: "+fd.n;
            }
        }).catch(function(){});
        _supa.channel("stats-changes").on("postgres_changes", {
            event: "*",
            schema: "public",
            table: "daily_stats",
            filter: "uid=eq."+_uid
        }, function(payload) {
            try {
                var fd = payload.new && payload.new.data;
                var td2 = new Date(), tk2 = td2.getFullYear()+"-"+(td2.getMonth()+1)+"-"+td2.getDate();
                if(fd && fd.d === tk2) {
                    var cur = JSON.parse(localStorage.getItem("y_stats")||"{}");
                    if(fd.n > (cur.n||0)) {
                        localStorage.setItem("y_stats", JSON.stringify(fd));
                        var el = document.getElementById("today-cnt");
                        if(el) el.textContent = "今日: "+fd.n;
                    }
                }
            } catch(e){}
        }).subscribe();
    } catch(e){}
}
function loadProg() {
    // Migrate old storage key
    try {
        var oldKey = "sharplingo_progress_v2";
        var oldData = localStorage.getItem(oldKey);
        if(oldData && !localStorage.getItem(STORAGE_KEY)) {
            localStorage.setItem(STORAGE_KEY, oldData);
        }
        localStorage.removeItem(oldKey);
    } catch(e){}
    try { var p = localStorage.getItem(STORAGE_KEY); if(p) prog = JSON.parse(p); } catch(e) {}
    if(isDemo) { renderMods(); return; }
    if(!_uid) return;
    // Load from Supabase
    _supa.from('progress').select('data').eq('uid',_uid).single().then(function(result) {
        var d = result.data && result.data.data;
        if(d) {
            var merged = false;
            for(var k in d) {
                if(!prog[k] || (d[k].n || 0) > (prog[k].n || 0)) {
                    prog[k] = d[k];
                    merged = true;
                }
            }
            if(merged) saveProg();
        }
        renderMods();
        restoreState();
    }).catch(function(){ renderMods(); restoreState(); });
    // Listen for realtime changes
    _supa.channel('progress-changes').on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'progress',
        filter: 'uid=eq.'+_uid
    }, function(payload) {
        if(_syncing) return;
        var d = payload.new && payload.new.data;
        if(d && JSON.stringify(d) !== JSON.stringify(prog)) {
            prog = d;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(prog));
            renderMods();
        }
    }).subscribe();
}
loadProg();
// Load today count from localStorage + Supabase sync
// Streak tracking
function getTodayKey() {
    var td = new Date();
    return td.getFullYear()+'-'+(td.getMonth()+1)+'-'+td.getDate();
}
function getYesterdayKey() {
    var yd = new Date(Date.now() - 86400000);
    return yd.getFullYear()+'-'+(yd.getMonth()+1)+'-'+yd.getDate();
}
function updateStreak() {
    try {
        var tk = getTodayKey();
        var yk = getYesterdayKey();
        var streak = JSON.parse(localStorage.getItem('y_streak') || '{}');
        if(streak.d === tk) return; // 今天已更新过
        if(streak.d === yk) {
            streak.s = (streak.s || 1) + 1; // 连续
        } else {
            streak.s = 1; // 中断或首次
        }
        streak.d = tk;
        localStorage.setItem('y_streak', JSON.stringify(streak));
        showStreak(streak.s);
    } catch(e){}
}
function showStreak(s) {

function norm(s) { return s.replace(/\s+/g," ").trim(); }

function stripPunct(s) {
    return s.replace(/[.,!?\u3002\uFF0C\u3001\uFF01\uFF1F\u002E]+$/g, "");
}

function normApost(s) { return s.replace(/[\u2018\u2019\u201A\u201B\u2032\u2035`']/g, "'"); }

function checkAns(ua, ca) {
    if(!ua || !ca) return false;
    var u = normApost(norm(ua));
    var up = stripPunct(u);
    var alts = ca.split("\u6216").map(function(s){ return normApost(norm(s)); }).filter(Boolean);
    for(var i=0; i<alts.length; i++) {
        var a = norm(alts[i]);
        var ap = stripPunct(a);
        if(u === a || up === ap) return true;
    }
    if(ca.indexOf("\u6216") === -1 && ca.indexOf(",") >= 0) {
        var ca2 = ca.split(",").map(function(s){ return normApost(norm(s)); }).filter(Boolean);
        for(var i=0; i<ca2.length; i++) {
            var a = normApost(norm(ca2[i]));
            var ap = stripPunct(a);
            if(u === a || up === ap) return true;
        }
    }
    return false;
}

function startStudy(mi, si) {
    if(!langData || !langData[mi] || !langData[mi].sections[si]) return;
    curModIdx = mi;
    curSecIdx = si;
    saveState();
    var sec = langData[mi].sections[si];
    document.getElementById("scr-modules").classList.add("hide");
    document.getElementById("scr-sections").classList.add("hide");
    var _st=document.getElementById("scr-study");_st.classList.remove("hide");_st.classList.remove("page-in");void _st.offsetWidth;_st.classList.add("page-in");
    document.getElementById("study-sec-name").textContent = sec.name.substring(0,45);
    var available = [];
    for(var ci=0; ci<sec.cards.length; ci++) {
        var c = sec.cards[ci];
        var p = prog[c.i];
        if(!p || !p.m) available.push(c);
    }
    if(available.length === 0) {
        available = sec.cards.slice();
        for(var ci=0; ci<sec.cards.length; ci++) {
            var p = prog[sec.cards[ci].i];
            if(p) { delete p.m; delete p.done; }
        }
        saveProg();
    }
    var typeOrder = ["dictation","dictationChinese","meaningChinese","word","multi","gender","plural","feminine","pastParticiple","isSeparable","presentTenseConjugation","pastTenseConjugation","konjunktivII","imperativ","comparativ","superlativ","phrase","custom","array","一般"];
    // 词组式出题：按类型分组 → 同类型内按 word._id 聚合 → 词组间随机
    var groups = {};
    for(var ci=0; ci<available.length; ci++) {
        var c = available[ci];
        var t = c.t || "一般";
        if(!groups[t]) groups[t] = [];
        groups[t].push(c);
    }
    cards = [];
    for(var ti=0; ti<typeOrder.length; ti++) {
        var t = typeOrder[ti];
        if(groups[t]) {
            var g = groups[t].slice();
            // 按 word._id 分组（同词卡片在一起）
            var byWord = {}, noWord = [];
            for(var i=0; i<g.length; i++) {
                var wid = (g[i].word && g[i].word._id) ? g[i].word._id.toString() : null;
                if(wid) { if(!byWord[wid]) byWord[wid]=[]; byWord[wid].push(g[i]); }
                else noWord.push(g[i]);
            }
            // 词组间随机打乱
            var wordKeys = Object.keys(byWord);
            for(var i=wordKeys.length-1; i>0; i--) {
                var j = Math.floor(Math.random()*(i+1));
                var tmp = wordKeys[i]; wordKeys[i] = wordKeys[j]; wordKeys[j] = tmp;
            }
            // 输出：同词卡片连续，词间随机
            for(var wi=0; wi<wordKeys.length; wi++) {
                var wg = byWord[wordKeys[wi]];
                for(var i=0; i<wg.length; i++) cards.push(wg[i]);
            }
            for(var i=0; i<noWord.length; i++) cards.push(noWord[i]);
        }
    }
    cardIdx = 0;
    sessStats = {ok:0,no:0,tot:0};
    showCard();
}

        if(p.r <= 3) {

var _studySkipTo = null;
var _studyDepth=0;function startStudyAll() {if(++_studyDepth>50){alert("全部学习完成！");_studySkipTo=null;_studyDepth=0;goHome();return;}
    // Find current learning position: first module+section with un-mastered cards
    var now = Date.now();
    var curMi = -1, curSi = -1;
    for(var mi=0; mi<langData.length; mi++) {
        for(var si=0; si<langData[mi].sections.length; si++) {
            if(_studySkipTo && (mi < _studySkipTo.mi || (mi === _studySkipTo.mi && si < _studySkipTo.si))) continue;
            if(_studySkipTo) _studySkipTo = null;
            var sec = langData[mi].sections[si];
            for(var ci=0; ci<sec.cards.length; ci++) {
                var p = prog[sec.cards[ci].i];
                if(!p || !p.m) { curMi = mi; curSi = si; break; }
            }
            if(curMi >= 0) break;
        }
        if(curMi >= 0) break;
    }
    if(curMi < 0) { alert("\u5168\u90e8\u5b66\u4e60\u5b8c\u6210\uff01"); return; }
    
    // Collect review cards from ALL earlier sections + current section
    var reviewCards = [];
    var newCards = [];
    var typeOrder = ["dictation","dictationChinese","meaningChinese","word","multi","gender","plural","feminine","pastParticiple","isSeparable","presentTenseConjugation","pastTenseConjugation","konjunktivII","imperativ","comparativ","superlativ","phrase","custom","array","\u4e00\u822c"];
    
    for(var mi=0; mi<=curMi; mi++) {
        var maxSi = (mi === curMi) ? curSi : langData[mi].sections.length - 1;
        for(var si=0; si<=maxSi; si++) {
            var sec = langData[mi].sections[si];
            for(var ci=0; ci<sec.cards.length; ci++) {
                var c = sec.cards[ci];
                var p = prog[c.i];
                if(p && p.m) continue;
                if(p && p.n && p.n < now) {
                    reviewCards.push({card:c, modIdx:mi, secIdx:si});
                } else if(!p || (!p.r && !p.m)) {
                    newCards.push({card:c, modIdx:mi, secIdx:si});
                }
            }
        }
    }
    
    if(reviewCards.length === 0 && newCards.length === 0) {
        _studySkipTo = {mi: curMi, si: curSi + 1};
        if(_studySkipTo.si >= langData[_studySkipTo.mi].sections.length) {
            _studySkipTo.mi++; _studySkipTo.si = 0;
        }
        if(_studySkipTo.mi >= langData.length) {
            alert("\u5168\u90e8\u5b66\u4e60\u5b8c\u6210\uff01");
            _studySkipTo = null;
            return;
        }
        startStudyAll();
        return;
    }
    _studySkipTo = null;
    
    function sortCards(arr) {
        var groups = {};
        for(var i=0; i<arr.length; i++) {
            var t = arr[i].card.t || "\u4e00\u822c";
            if(!groups[t]) groups[t] = [];
            groups[t].push(arr[i]);
        }
        var result = [];
        for(var ti=0; ti<typeOrder.length; ti++) {
            var t = typeOrder[ti];
            if(groups[t]) {
                var g = groups[t].slice();
                // 按 word._id 分组（同词卡片连续）
                var byWord = {}, noWord = [];
                for(var i=0; i<g.length; i++) {
                    var wid = (g[i].card.word && g[i].card.word._id) ? g[i].card.word._id.toString() : null;
                    if(wid) { if(!byWord[wid]) byWord[wid]=[]; byWord[wid].push(g[i]); }
                    else noWord.push(g[i]);
                }
                var wordKeys = Object.keys(byWord);
                for(var i=wordKeys.length-1; i>0; i--) { var j=Math.floor(Math.random()*(i+1)); var tmp=wordKeys[i]; wordKeys[i]=wordKeys[j]; wordKeys[j]=tmp; }
                for(var wi=0; wi<wordKeys.length; wi++) {
                    var wg = byWord[wordKeys[wi]];
                    for(var i=0; i<wg.length; i++) result.push(wg[i]);
                }
                for(var i=0; i<noWord.length; i++) result.push(noWord[i]);
            }
        }
        return result;
    }
    
    var allCards = sortCards(reviewCards).concat(sortCards(newCards));
    
    curModIdx = curMi;
    curSecIdx = curSi;
    cards = allCards.map(function(x){ return x.card; });

}

    for(var mi=curModIdx; mi<langData.length; mi++) {
        for(var si=(mi===curModIdx?curSecIdx+1:0); si<langData[mi].sections.length; si++) {
            var sec = langData[mi].sections[si];
            for(var ci=0; ci<sec.cards.length; ci++) {
                var p = prog[sec.cards[ci].i];
                if(!p || !p.m) {
                    startStudy(mi, si);
                    return;
                }
            }
        }
    }
    alert("\u5168\u90e8\u5b66\u4e60\u5b8c\u6210\uff01");
    goHome();
};
document.addEventListener("keydown", function(e) {
    // Enter: 提交或下一题
    if(e.key==="Enter") {
        if(!document.getElementById("btn-submit").classList.contains("hide")) submitAns();
        else if(!document.getElementById("btn-next").classList.contains("hide")) nextCard();
        else if(!document.getElementById("btn-next-sec").classList.contains("hide")) document.getElementById("btn-next-sec").click();
    }
    // 数字键 1-4 快速选择选项
    if(e.key >= "1" && e.key <= "4" && !document.getElementById("btn-submit").classList.contains("hide")) {
        var oa = document.getElementById("opts-area");
        if(oa && !oa.classList.contains("hide")) {
            var idx = parseInt(e.key) - 1;
            var opts = oa.querySelectorAll("div");
            if(opts[idx]) opts[idx].click();
        }
    }
    // E键：太简单了
    if((e.key==="e"||e.key==="E") && !document.getElementById("btn-easy").classList.contains("hide") && (!document.activeElement || document.activeElement.tagName !== "INPUT")) {
        e.preventDefault();
        markEasy();
    }
    // D键：42天后再问我
    if((e.key==="d"||e.key==="D") && !document.getElementById("btn-42").classList.contains("hide") && (!document.activeElement || document.activeElement.tagName !== "INPUT")) {
        e.preventDefault();
        mark42();
    }
    // 空格键：下一题
    if(e.key === " " && !document.getElementById("btn-next").classList.contains("hide") && (!document.activeElement || document.activeElement.tagName !== "INPUT")) {
        e.preventDefault();
        nextCard();
    }
});

// Init
document.getElementById("btn-start-study").onclick = function(){_studyDepth=0;startStudyAll();};
switchLang(localStorage.getItem("y_lang")||"german");</script>
